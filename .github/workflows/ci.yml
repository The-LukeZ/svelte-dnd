name: CI

on:
    push:
        branches: [dev, master, "stage/**"]
    pull_request:
        branches: [dev, master, "stage/**"]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            # Restored before pnpm/setup, which runs the install (and Cypress's postinstall).
            - name: Cache Cypress binary
              uses: actions/cache@v6
              with:
                  path: ~/.cache/Cypress
                  key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

            # pnpm version comes from "packageManager" in the root package.json.
            # Installs Node, then runs `pnpm install --frozen-lockfile`.
            - uses: pnpm/setup@v3
              with:
                  runtime: node@24
                  cache: true
                  require-lockfile: true

            - name: Cache Playwright browsers
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

            # --with-deps installs the OS libraries too, which the cache does not hold.
            - run: pnpm --filter @lukez/svelte-dnd exec playwright install --with-deps chromium firefox webkit

            - run: pnpm lint
            - run: pnpm format:check
            - run: pnpm build
            - run: pnpm check:package
            - run: pnpm test:all

            - name: Upload Cypress screenshots
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: cypress-screenshots
                  path: packages/svelte-dnd/cypress/screenshots
                  if-no-files-found: ignore
